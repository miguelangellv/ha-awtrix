settings:
  name: Configure Awtrix Parameters
  description: Configure various parameters of the Awtrix display through MQTT.
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to configure.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    ATIME:
      name: "App Display Duration"
      description: "Duration (in seconds) an app is displayed."
      example: 7
      selector:
        number:
          min: 1
          mode: box
    TEFF:
      name: "App Transition Effect"
      description: "Choose between app transition effects (0-10)."
      example: 1
      selector:
        select:
          mode: dropdown
          options:
            - value: "0"
              label: Random
            - value: "1"
              label: Slide
            - value: "2"
              label: Dim
            - value: "3"
              label: Zoom
            - value: "4"
              label: Rotate
            - value: "5"
              label: Pixelate
            - value: "6"
              label: Curtain
            - value: "7"
              label: Ripple
            - value: "8"
              label: Blink
            - value: "9"
              label: Reload
            - value: "10"
              label: Fade
    TSPEED:
      name: "App Transition Speed"
      description: "Time (in milliseconds) taken for the transition to the next app."
      example: 500
      selector:
        number:
          min: 1
          mode: box
    TCOL:
      name: "Global Text Color"
      description: "Global text color for the display."
      example: "#FFFFFF"
      selector:
        color_rgb: {}
    TMODE:
      name: "Time App Style"
      description: "Changes the style of the time app (0-6)."
      example: 1
      selector:
        select:
          mode: dropdown
          options:
            - value: "0"
              label: Time + Weekday
            - value: "1"
              label: Icon1 + Time + Weekday
            - value: "2"
              label: Icon1 + Weekday + Time
            - value: "3"
              label: Icon2 + Time + Weekday
            - value: "4"
              label: Icon2 + Weekday + Time
            - value: "5"
              label: Time
            - value: "6"
              label: Binary
    CHCOL:
      name: "Calendar Header Color"
      description: "Color of the calendar header in the time app."
      example: "#FF0000"
      selector:
        color_rgb: {}
    CBCOL:
      name: "Calendar Body Color"
      description: "Color of the calendar body in the time app."
      example: "#FFFFFF"
      selector:
        color_rgb: {}
    CTCOL:
      name: "Calendar Text Color"
      description: "Text color for the calendar in the time app."
      example: "#000000"
      selector:
        color_rgb: {}
    WD:
      name: "Weekday Display"
      description: "Enable or disable the weekday display."
      example: true
      selector:
        boolean: {}
    WDCA:
      name: "Active Weekday Color"
      description: "Color for active weekdays."
      example: "#00FF00"
      selector:
        color_rgb: {}
    WDCI:
      name: "Inactive Weekday Color"
      description: "Color for inactive weekdays."
      example: "#888888"
      selector:
        color_rgb: {}
    BRI:
      name: "Matrix Brightness"
      description: "Brightness of the matrix (0-255)."
      example: 128
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    ABRI:
      name: "Automatic Brightness Control"
      description: "Enable or disable automatic brightness adjustment."
      example: true
      selector:
        boolean: {}
    ATRANS:
      name: "Automatic App Transition"
      description: "Enable or disable automatic switching to the next app."
      example: true
      selector:
        boolean: {}
    CCORRECTION:
      name: "Color Correction"
      description: "Adjust the color correction for the matrix (RGB values)."
      example: "[255, 255, 255]"
      selector:
        object: {}
    CTEMP:
      name: "Color Temperature"
      description: "Set the color temperature for the matrix (RGB values)."
      example: "[255, 180, 150]"
      selector:
        object: {}
    TFORMAT:
      name: "Time Format"
      description: "Format for the time display. Check: https://blueforcer.github.io/awtrix3/#/api?id=available-time-formats"
      example: "HH:mm"
      selector:
        text: {}
    DFORMAT:
      name: "Date Format"
      description: "Format for the date display. Check: https://blueforcer.github.io/awtrix3/#/api?id=available-date-formats"
      example: "DD/MM/YYYY"
      selector:
        text: {}
    SOM:
      name: "Start Week on Monday"
      description: "Enable or disable starting the week on Monday."
      example: true
      selector:
        boolean: {}
    CEL:
      name: "Celsius Temperature"
      description: "Display temperature in Celsius (false for Fahrenheit)."
      example: true
      selector:
        boolean: {}
    BLOCKN:
      name: "Block Physical Navigation Keys"
      description: "Block physical navigation keys but still send input via MQTT."
      example: false
      selector:
        boolean: {}
    UPPERCASE:
      name: "Uppercase Text"
      description: "Display text in uppercase."
      example: true
      selector:
        boolean: {}
    TIME_COL:
      name: "Time App Text Color"
      description: "Text color for the time app. Use 0 for global text color."
      example: "#00FF00"
      selector:
        color_rgb: {}
    DATE_COL:
      name: "Date App Text Color"
      description: "Text color for the date app. Use 0 for global text color."
      example: "#FF8800"
      selector:
        color_rgb: {}
    TEMP_COL:
      name: "Temperature App Text Color"
      description: "Text color for the temperature app. Use 0 for global text color."
      example: "#00FFFF"
      selector:
        color_rgb: {}
    HUM_COL:
      name: "Humidity App Text Color"
      description: "Text color for the humidity app. Use 0 for global text color."
      example: "#8888FF"
      selector:
        color_rgb: {}
    BAT_COL:
      name: "Battery App Text Color"
      description: "Text color for the battery app. Use 0 for global text color."
      example: "#FF00FF"
      selector:
        color_rgb: {}
    SSPEED:
      name: "Scroll Speed"
      description: "Modification percentage for the original scroll speed."
      example: 100
      selector:
        number:
          min: 1
          mode: box
    TIM:
      name: "Enable Time App"
      description: "Enable or disable the native time app (requires reboot)."
      example: true
      selector:
        boolean: {}
    DAT:
      name: "Enable Date App"
      description: "Enable or disable the native date app (requires reboot)."
      example: true
      selector:
        boolean: {}
    HUM:
      name: "Enable Humidity App"
      description: "Enable or disable the native humidity app (requires reboot)."
      example: true
      selector:
        boolean: {}
    TEMP:
      name: "Enable Temperature App"
      description: "Enable or disable the native temperature app (requires reboot)."
      example: true
      selector:
        boolean: {}
    BAT:
      name: "Enable Battery App"
      description: "Enable or disable the native battery app (requires reboot)."
      example: true
      selector:
        boolean: {}
    MATP:
      name: "Enable Matrix"
      description: "Enable or disable the matrix without power animation."
      example: true
      selector:
        boolean: {}
    VOL:
      name: "Buzzer Volume"
      description: "Set the volume for the buzzer and DFPlayer (0-30)."
      example: 10
      selector:
        number:
          min: 0
          max: 30
          mode: box
    OVERLAY:
      name: "Global Overlay Effect"
      description: "Set a global effect overlay (cannot be used with app-specific overlays)."
      example: "clear"
      selector:
        select:
          mode: dropdown
          options:
            - clear
            - snow
            - rain
            - drizzle
            - storm
            - thunder
            - frost

    # AWTRIX NG settings (sent as-is to AWTRIX NG devices)
    AWTRIX NG Settings:
      collapsed: true
      fields:
        brightness:
          name: "Brightness"
          description: "Panel brightness, raw level 0-255 (ignored while auto brightness is on). AWTRIX NG only."
          example: 120
          selector:
            number:
              min: 0
              max: 255
              mode: slider
        saturation:
          name: "Saturation"
          description: "Colourfulness in percent; 0 shows everything in grey. AWTRIX NG only."
          example: 100
          selector:
            number:
              min: 0
              max: 100
              mode: slider
        autoBrightness:
          name: "Auto Brightness"
          description: "Let the light sensor drive the brightness. AWTRIX NG only."
          selector:
            boolean: {}
        appDurationMs:
          name: "App Duration (ms)"
          description: "How long each app is shown. AWTRIX NG only."
          example: 7000
          selector:
            number:
              min: 0
              mode: box
              unit_of_measurement: ms
        autoTransition:
          name: "Auto Transition"
          description: "Rotate through the apps automatically. AWTRIX NG only."
          selector:
            boolean: {}
        transitionEffect:
          name: "Transition Effect"
          description: "Animation played when the rotation changes app. AWTRIX NG only."
          example: "Slide"
          selector:
            select:
              mode: dropdown
              options:
                - Random
                - Slide
                - Dim
                - Zoom
                - Rotate
                - Pixelate
                - Curtain
                - Ripple
                - Blink
                - Reload
                - Fade
                - Cover
                - Uncover
                - Split
                - Blinds
                - Blocks
                - Flash
                - Diamond
                - Wave
                - Rain
                - Melt
                - Interlace
        transitionDirection:
          name: "Transition Direction"
          description: "Mirror direction-aware transitions. AWTRIX NG only."
          selector:
            select:
              options:
                - normal
                - reverse
        transitionDurationMs:
          name: "Transition Duration (ms)"
          description: "Length of the transition animation, 0 = instant. AWTRIX NG only."
          example: 1000
          selector:
            number:
              min: 0
              mode: box
              unit_of_measurement: ms
        timeMode:
          name: "Clock Style"
          description: "Clock layout 0-6 (0 centred, 1-4 calendar box variants, 5 big clock, 6 binary clock). AWTRIX NG only."
          selector:
            number:
              min: 0
              max: 6
              mode: box
        time24h:
          name: "24-hour Clock"
          description: "Use a 24-hour clock. AWTRIX NG only."
          selector:
            boolean: {}
        timeShowSeconds:
          name: "Show Seconds"
          description: "Append :SS to the time. AWTRIX NG only."
          selector:
            boolean: {}
        timeSeparatorMode:
          name: "Clock Separator"
          description: "Behaviour of the colon between hours and minutes. AWTRIX NG only."
          selector:
            select:
              options:
                - steady
                - blink
                - pulse
        useCelsius:
          name: "Use Celsius"
          description: "Show temperatures in Celsius. AWTRIX NG only."
          selector:
            boolean: {}
        soundEnabled:
          name: "Sound Enabled"
          description: "Mute switch for one-shot sounds. AWTRIX NG only."
          selector:
            boolean: {}
        buzzerVolume:
          name: "Buzzer Volume"
          description: "Buzzer volume in percent. AWTRIX NG only."
          selector:
            number:
              min: 0
              max: 100
              mode: slider
        radioVolume:
          name: "Radio Volume"
          description: "Internet radio volume in percent. AWTRIX NG only."
          selector:
            number:
              min: 0
              max: 100
              mode: slider
        scroll:
          name: "Text Scrolling"
          description: 'Device-wide text motion, e.g. {"mode":"loop","speed":80,"direction":"left"}. AWTRIX NG only.'
          selector:
            object: {}
        weekdayBar:
          name: "Weekday Bar"
          description: 'Weekday bar options, e.g. {"show":true,"startOnMonday":true}. AWTRIX NG only.'
          selector:
            object: {}

dismiss:
  name: Dismiss Custom notification
  description: Dismiss the current notification on the Awtrix display.
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to clear the notification on.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG

    name:
      name: Notification name
      description: "Dismiss only the notification that was sent with this name. AWTRIX NG only; leave empty to dismiss the active one."
      example: "backup-job"
      selector:
        text: {}

notification:
  name: Display Custom notification
  description: Send a custom message to the Awtrix display.
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to send the notification to.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    # Notification Global params
    Notification Global Parameters:
      collapsed: true
      fields:
        duration:
          name: "Display Duration"
          description: "Time (in seconds) setting how long the notification should be displayed."
          example: 5
          selector:
            number:
              min: 1
              mode: box
        
        repeat:
          name: "Repeat Scroll"
          description: "Number setting how many times the text should be scrolled through the matrix before the notification ends (-1 duration taken into account)."
          example: -1
          selector:
            number:
              min: -1
              mode: box
        
        hold:
          name: "Hold Notification"
          description: "Set it to true, to hold your notification on top until you press the middle button or dismiss it via HomeAssistant."
          example: false
          selector:
            boolean: {}
        
        stack:
          name: "Stack Notifications"
          description: "If disabled, replaces the current notification immediately."
          example: true
          selector:
            boolean: {}
        
        wakeup:
          name: "Wake Up Matrix"
          description: "If off, wakes up the matrix during the notification."
          example: false
          selector:
            boolean: {}

        clients:
          name: "Forward to Clients"
          description: "Send this notification to other Awtrix devices."
          example: ["prefix1", "prefix2"]
          selector:
            object: {}
    
    # Text params
    Text Parameters:
      collapsed: true
      fields:
        text:
          name: "Message Text"
          description: >
            The text to display on the matrix (Ex.: Hello, Awtrix).
            To present text where specific fragments can be colorized,
            use an array of fragments with "t" representing the text fragment
            and "c" denoting the color's hex value (Ex.: [{ "t": "Hello, ", "c": "FF0000"}, {"t": "world!", "c": "00FF00"}]).
          example: "Hello, Awtrix!"
          selector:
            object: {}
        
        textCase:
          name: "Text Case"
          description: "Convert text case."
          example: 0
          selector:
            select:
              mode: dropdown
              options:
                - value: "0"
                  label: Global setting
                - value: "1"
                  label: Uppercase
                - value: "2"
                  label: No transform
        
        color:
          name: "Color"
          description: "Color of the text or charts."
          example: "#FFFFFF"
          selector:
            color_rgb: {}

        rainbow:
          name: "Rainbow Effect"
          description: "Applies an animated rainbow effect to the text."
          example: false
          selector:
            boolean: {}

        gradient:
          name: "Gradient Colors"
          description: "Applies a gradient using two colors."
          example: ["#FF0000", "#0000FF"]
          selector:
            object: {}

        center:
          name: "Center Text"
          description: "Centers short, non-scrollable text."
          example: true
          selector:
            boolean: {}

        topText:
          name: "Top Text"
          description: "If enabled, draws the text on top."
          example: false
          selector:
            boolean: {}
        
        textOffset:
          name: "Text Offset"
          description: "Sets an offset for the text's starting position."
          example: 0
          selector:
            number:
              min: 0
              mode: box
        
        blinkText:
          name: "Blink Interval"
          description: "Blinks the text at the given interval (ms)."
          example: 500
          selector:
            number:
              min: 0
              mode: box
        
        fadeText:
          name: "Fade Interval"
          description: "Fades text on and off at the given interval (ms)."
          example: 700
          selector:
            number:
              min: 0
              mode: box
        
        noScroll:
          name: "Disable Scrolling"
          description: "Prevents text from scrolling."
          example: false
          selector:
            boolean: {}
        
        scrollSpeed:
          name: "Scroll Speed"
          description: "Percentage of the original scroll speed."
          example: 100
          selector:
            number:
              min: 1
              max: 200
              mode: box
    
    # Background and Effect params
    Background & Effect Parameters:
      collapsed: true
      fields:
        background:
          name: "Background Color"
          description: "Sets the background color."
          example: "#000000"
          selector:
            color_rgb: {}

        effect:
          name: "Background Effect"
          description: "Effect to display in the background."
          example: "fire"
          selector:
            select:
              mode: dropdown
              options:
                - BrickBreaker
                - Checkerboard
                - Fireworks
                - PingPong
                - Radar
                - Ripple
                - Snake
                - TwinklingStars
                - TheaterChase
                - ColorWaves
                - SwirlOut
                - SwirlIn
                - LookingEyes
                - Matrix
                - Pacifica
                - Plasma
                - PlasmaCloud
                - MovingLine
                - Fade
        
        effectSettings:
          name: "Effect Settings"
          description: "Settings for color and speed of the effect."
          example: '{ "effect":"Plasma",  "effectSettings":{ "speed":3, "palette":"Rainbow", "blend":true }}'
          selector:
            object: {}
        
        overlay:
          name: "Overlay Effect"
          description: "Sets an overlay effect."
          example: "clear"
          selector:
            select:
              mode: dropdown
              options:
                - clear
                - snow
                - rain
                - drizzle
                - storm
                - thunder
                - frost
        
    # Icon params
    Icon Parameters:
      collapsed: true
      fields:
        icon:
          name: "Icon"
          description: "ID or filename of an icon to display."
          example: "weather_sun"
          selector:
            text: {}

        pushIcon:
          name: "Icon Behavior"
          description: "0 = static, 1 = moves once, 2 = reappears."
          example: 0
          selector:
            select:
              mode: dropdown
              options:
                - value: "0"
                  label: Static
                - value: "1"
                  label: Moves once
                - value: "2"
                  label: Reappears
        
    # Sound params
    Sound Parameters:
      collapsed: true
      fields:
        sound:
          name: "Sound File"
          description: "Filename of the RTTTL or MP3 file to play."
          example: "alert"
          selector:
            text: {}

        rtttl:
          name: "RTTTL Sound String"
          description: "RTTTL formatted sound string to play."
          example: "d=4,o=5,b=100:c,d,e,f,g,a,b"
          selector:
            select:
              options:
                - label: Two-Short
                  value: two_short:d=4,o=5,b=100:16e6,16e6
                - label: Long
                  value: long:d=1,o=5,b=100:e6
                - label: Alarm
                  value: Alarm4:d=4,o=6,b=100:c,p,c,p,c,p,c
                - label: Warning
                  value: Warning:d=4,o=5,b=180:a,8p,a,8p,a,8p,a
                - label: Siren
                  value: siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e
                - label: Pling
                  value: Pling:d=16,o=6,b=140:e6,32p,d6
              custom_value: true

        loopSound:
          name: "Loop Sound"
          description: "Repeats the sound as long as the notification is active."
          example: false
          selector:
            boolean: {}

    # Graph & Chart params
    Graph & Chart Parameters:
      collapsed: true
      fields:
        bar:
          name: "Bar Graph Data"
          description: "Draws a bargraph. Without icon maximum 16 values, with icon 11 values: [ 10, 20, 30, 40 ]"
          example: [10, 20, 30, 40]
          selector:
            object: {}

        barBC:
          name: "Bar Background Color"
          description: "Color of the bar graph background."
          example: "#222222"
          selector:
            color_rgb: {}

        line:
          name: "Line Chart Data"
          description: "Draws a linechart. Without icon maximum 16 values, with icon 11 values: [ 5, 15, 25, 35 ]"
          example: [5, 15, 25, 35]
          selector:
            object: {}

        autoscale:
          name: "Autoscale Graph"
          description: "Enables autoscaling for bar and line charts."
          example: true
          selector:
            boolean: {}

        progress:
          name: "Progress Value"
          description: "Displays a progress bar (0-100)."
          example: 50
          selector:
            number:
              min: 0
              max: 100
              mode: slider

        progressC:
          name: "Progress Bar Color"
          description: "Color of the progress bar."
          example: "#00FF00"
          selector:
            color_rgb: {}

        progressBC:
          name: "Progress Bar Background"
          description: "Color of the progress bar background."
          example: "#333333"
          selector:
            color_rgb: {}

        draw:
          name: "Draw a custom image"
          description: "Array of drawing instructions. Each object represents a drawing command. https://blueforcer.github.io/awtrix3/#/api?id=drawing-instructions"
          example: '{"draw":[ {"dc": [28, 4, 3, "#FF0000"]}, {"dr": [20, 4, 4, 4, "#0000FF"]}, {"dt": [0, 0, "Hello", "#00FF00"]} ]}'
          selector:
            text:
              multiline: true 

    # AWTRIX NG options (AWTRIX 3 devices ignore or reject these)
    AWTRIX NG Parameters:
      collapsed: true
      fields:
        name:
          name: "Notification Name"
          description: "Label used to dismiss this notification later with the Dismiss action. AWTRIX NG only."
          example: "backup-job"
          selector:
            text: {}
        textColor:
          name: "Text Color (NG)"
          description: "Text colour, or the word palette to paint the text from the palette. AWTRIX NG only."
          selector:
            text: {}
        font:
          name: "Font"
          description: "Panel font; large is seven rows tall. AWTRIX NG only."
          selector:
            select:
              options:
                - small
                - large
        effectSpeed:
          name: "Effect Speed"
          description: "Pace multiplier for the effect and overlay of this app (0.1-10). AWTRIX NG only."
          example: 1.0
          selector:
            number:
              min: 0.1
              max: 10
              step: 0.1
              mode: box
        palette:
          name: "Palette"
          description: "Built-in palette name (Cloud, Lava, Ocean, Forest, Stripe, Party, Heat, Rainbow) or a list of colour stops. AWTRIX NG only."
          example: "Lava"
          selector:
            object: {}
        paletteBlend:
          name: "Blend Palette"
          description: "Interpolate between palette entries instead of hard bands. AWTRIX NG only."
          selector:
            boolean: {}
        paletteSpan:
          name: "Palette Span"
          description: "Pixels per full palette pass when painting text, 0 = stretch. AWTRIX NG only."
          selector:
            number:
              min: 0
              mode: box
        paletteSpeed:
          name: "Palette Speed"
          description: "Palette passes per second when painting text, 0 = still. AWTRIX NG only."
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              mode: box
        iconMode:
          name: "Icon Mode"
          description: "Whether approaching text shoves the icon aside. AWTRIX NG only."
          selector:
            select:
              options:
                - fixed
                - pushOnce
                - push
        scroll:
          name: "Text Scrolling"
          description: 'Per-app text motion, e.g. {"mode":"bounce","speed":80}. AWTRIX NG only.'
          selector:
            object: {}
        durationMs:
          name: "Display Duration (ms)"
          description: "Same as Display Duration but in milliseconds. AWTRIX NG only."
          selector:
            number:
              min: 0
              mode: box
              unit_of_measurement: ms

custom_app:
  name: Display Custom app
  description: Send a custom message to the Awtrix display.
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to update the custom app.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    
    # Custom App Global params
    Custom App Global Parameters:
      collapsed: true
      fields:
        app:
          name: App Name
          required: true
          description: The name of the custom app to update.
          selector:
            text: {}

        save:
          name: "Save to Flash"
          description: "Saves the custom app to flash memory."
          example: false
          selector:
            boolean: {}

        duration:
          name: "Display Duration"
          description: "Time (in seconds) to display the app."
          example: 5
          selector:
            number:
              min: 1
              mode: box

        repeat:
          name: "Repeat Scroll"
          description: "Number of times the text scrolls (-1 for infinite)."
          example: -1
          selector:
            number:
              min: -1
              mode: box

        lifetime:
          name: "App Lifetime"
          description: "Removes the app if no update is received within this time (seconds)."
          example: 10
          selector:
            number:
              min: 0
              mode: box

        lifetimeMode:
          name: "Lifetime Mode"
          description: "0 = deletes the app, 1 = marks it as stale with a red rectangle around the app."
          example: 0
          selector:
            select:
              mode: dropdown
              options:
                - value: "0"
                  label: Deletes the app
                - value: "1"
                  label: Mark it as stale

        pos:
          name: "Custom Page Position"
          description: "Defines the position of the custom page in the loop."
          example: 2
          selector:
            number:
              min: 0
              mode: box

    # Text params
    Text Parameters:
      collapsed: true
      fields:
        text:
          name: "Message Text"
          description: >
            The text to display on the matrix (Ex.: Hello, Awtrix).
            To present text where specific fragments can be colorized,
            use an array of fragments with "t" representing the text fragment
            and "c" denoting the color's hex value (Ex.: [{ "t": "Hello, ", "c": "FF0000"}, {"t": "world!", "c": "00FF00"}]).
          example: "Hello, Awtrix!"
          selector:
            object: {}

        textCase:
          name: "Text Case"
          description: "Convert text case."
          example: 0
          selector:
            select:
              mode: dropdown
              options:
                - value: "0"
                  label: Global setting
                - value: "1"
                  label: Uppercase
                - value: "2"
                  label: No transform

        color:
          name: "Color"
          description: "Color of the text or charts."
          example: "#FFFFFF"
          selector:
            color_rgb: {}

        rainbow:
          name: "Rainbow Effect"
          description: "Applies an animated rainbow effect to the text."
          example: false
          selector:
            boolean: {}

        gradient:
          name: "Gradient Colors"
          description: "Applies a gradient using two colors."
          example: ["#FF0000", "#0000FF"]
          selector:
            object: {}

        center:
          name: "Center Text"
          description: "Centers short, non-scrollable text."
          example: true
          selector:
            boolean: {}

        topText:
          name: "Top Text"
          description: "If enabled, draws the text on top."
          example: false
          selector:
            boolean: {}

        textOffset:
          name: "Text Offset"
          description: "Sets an offset for the text's starting position."
          example: 0
          selector:
            number:
              min: 0
              mode: box

        blinkText:
          name: "Blink Interval"
          description: "Blinks the text at the given interval (ms)."
          example: 500
          selector:
            number:
              min: 0
              mode: box

        fadeText:
          name: "Fade Interval"
          description: "Fades text on and off at the given interval (ms)."
          example: 700
          selector:
            number:
              min: 0
              mode: box

        noScroll:
          name: "Disable Scrolling"
          description: "Prevents text from scrolling."
          example: false
          selector:
            boolean: {}

        scrollSpeed:
          name: "Scroll Speed"
          description: "Percentage of the original scroll speed."
          example: 100
          selector:
            number:
              min: 1
              max: 200
              mode: box


    # Background and Effect params
    Background & Effect Parameters:
      collapsed: true
      fields:
        background:
          name: "Background Color"
          description: "Sets the background color."
          example: "#000000"
          selector:
            color_rgb: {}

        effect:
          name: "Background Effect"
          description: "Effect to display in the background."
          example: "fire"
          selector:
            select:
              mode: dropdown
              options:
                - BrickBreaker
                - Checkerboard
                - Fireworks
                - PingPong
                - Radar
                - Ripple
                - Snake
                - TwinklingStars
                - TheaterChase
                - ColorWaves
                - SwirlOut
                - SwirlIn
                - LookingEyes
                - Matrix
                - Pacifica
                - Plasma
                - PlasmaCloud
                - MovingLine
                - Fade

        effectSettings:
          name: "Effect Settings"
          description: "Settings for color and speed of the effect."
          example: '{ "effect":"Plasma",  "effectSettings":{ "speed":3, "palette":"Rainbow", "blend":true }}'
          selector:
            object: {}

        overlay:
          name: "Overlay Effect"
          description: "Sets an overlay effect."
          example: "clear"
          selector:
            select:
              mode: dropdown
              options:
                - clear
                - snow
                - rain
                - drizzle
                - storm
                - thunder
                - frost

    # Icon params
    Icon Parameters:
      collapsed: true
      fields:
        icon:
          name: "Icon"
          description: "ID or filename of an icon to display."
          example: "weather_sun"
          selector:
            text: {}
        pushIcon:
          name: "Icon Behavior"
          description: "0 = static, 1 = moves once, 2 = reappears."
          example: 0
          selector:
            select:
              mode: dropdown
              options:
                - value: "0"
                  label: Static
                - value: "1"
                  label: Moves once
                - value: "2"
                  label: Reappears
        
     # Graph & Chart params
    Graph & Chart Parameters:
      collapsed: true
      fields:
        bar:
          name: "Bar Graph Data"
          description: "Draws a bargraph. Without icon maximum 16 values, with icon 11 values: [ 10, 20, 30, 40 ]"
          example: [10, 20, 30, 40]
          selector:
            object: {}

        barBC:
          name: "Bar Background Color"
          description: "Color of the bar graph background."
          example: "#222222"
          selector:
            color_rgb: {}

        line:
          name: "Line Chart Data"
          description: "Draws a linechart. Without icon maximum 16 values, with icon 11 values: [ 5, 15, 25, 35 ]"
          example: [5, 15, 25, 35]
          selector:
            object: {}

        autoscale:
          name: "Autoscale Graph"
          description: "Enables autoscaling for bar and line charts."
          example: true
          selector:
            boolean: {}

        progress:
          name: "Progress Value"
          description: "Displays a progress bar (0-100)."
          example: 50
          selector:
            number:
              min: 0
              max: 100
              mode: slider

        progressC:
          name: "Progress Bar Color"
          description: "Color of the progress bar."
          example: "#00FF00"
          selector:
            color_rgb: {}

        progressBC:
          name: "Progress Bar Background"
          description: "Color of the progress bar background."
          example: "#333333"
          selector:
            color_rgb: {}

        draw:
          name: "Draw a custom image"
          description: "Array of drawing instructions. Each object represents a drawing command. https://blueforcer.github.io/awtrix3/#/api?id=drawing-instructions"
          example: '{"draw":[ {"dc": [28, 4, 3, "#FF0000"]}, {"dr": [20, 4, 4, 4, "#0000FF"]}, {"dt": [0, 0, "Hello", "#00FF00"]} ]}'
          selector:
            text:
              multiline: true  

    # AWTRIX NG options (AWTRIX 3 devices ignore or reject these)
    AWTRIX NG Parameters:
      collapsed: true
      fields:
        textColor:
          name: "Text Color (NG)"
          description: "Text colour, or the word palette to paint the text from the palette. AWTRIX NG only."
          selector:
            text: {}
        font:
          name: "Font"
          description: "Panel font; large is seven rows tall. AWTRIX NG only."
          selector:
            select:
              options:
                - small
                - large
        effectSpeed:
          name: "Effect Speed"
          description: "Pace multiplier for the effect and overlay of this app (0.1-10). AWTRIX NG only."
          example: 1.0
          selector:
            number:
              min: 0.1
              max: 10
              step: 0.1
              mode: box
        palette:
          name: "Palette"
          description: "Built-in palette name (Cloud, Lava, Ocean, Forest, Stripe, Party, Heat, Rainbow) or a list of colour stops. AWTRIX NG only."
          example: "Lava"
          selector:
            object: {}
        paletteBlend:
          name: "Blend Palette"
          description: "Interpolate between palette entries instead of hard bands. AWTRIX NG only."
          selector:
            boolean: {}
        paletteSpan:
          name: "Palette Span"
          description: "Pixels per full palette pass when painting text, 0 = stretch. AWTRIX NG only."
          selector:
            number:
              min: 0
              mode: box
        paletteSpeed:
          name: "Palette Speed"
          description: "Palette passes per second when painting text, 0 = still. AWTRIX NG only."
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              mode: box
        iconMode:
          name: "Icon Mode"
          description: "Whether approaching text shoves the icon aside. AWTRIX NG only."
          selector:
            select:
              options:
                - fixed
                - pushOnce
                - push
        scroll:
          name: "Text Scrolling"
          description: 'Per-app text motion, e.g. {"mode":"bounce","speed":80}. AWTRIX NG only.'
          selector:
            object: {}
        durationMs:
          name: "Display Duration (ms)"
          description: "Same as Display Duration but in milliseconds. AWTRIX NG only."
          selector:
            number:
              min: 0
              mode: box
              unit_of_measurement: ms

delete_custom_app:
  name: Delete Custom app
  description: Remove custom app from the Awtrix device.
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to delete the custom app.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    app:
      name: App Name
      required: true
      description: The name of the custom app to delete.
      selector:
        text: {}

deep_sleep:
  name: Deep Sleep
  description: "Send the board in deep sleep mode (turns off the matrix as well), good for saving battery life."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to put into deep sleep mode.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    sleep:
      name: Seconds to sleep
      description: "Number of seconds to sleep"
      example: 120
      selector:
        number:
          min: 1
          mode: box
          
switch_app:
  name: Switch to App
  description: "Directly switch to a specific app by name."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to switch apps on.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    name:
      name: App Name
      required: true
      description: "The name of the app to switch to. Built-in apps: Time, Date, Temperature, Humidity, Battery. For custom apps, use the name you set in the custom_app service."
      example: "Time"
      selector:
        text: {}
    fast:
      name: Switch instantly
      description: "Skip the transition animation. AWTRIX NG only."
      selector:
        boolean: {}

next_app:
  name: Next App
  description: "Switch the display to the next app."
  fields:
    device:
      name: Awtrix device
      required: true
