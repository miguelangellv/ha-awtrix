      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG

previous_app:
  name: Previous App
  description: "Switch the display to the previous app."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to control.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG

power:
  name: Matrix Power
  description: "Turn the LED matrix on or off."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to control.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    power:
      name: Power
      required: true
      description: "true turns the matrix on, false turns it off."
      example: true
      selector:
        boolean: {}

overlay:
  name: Weather Overlay
  description: "Set the device-wide weather overlay (rain, snow, drizzle, storm, thunder, frost) or clear it."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to control.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    overlay:
      name: Overlay
      required: true
      description: "Overlay to draw on top of every page; clear removes it."
      example: "rain"
      selector:
        select:
          mode: dropdown
          options:
            - clear
            - snow
            - rain
            - drizzle
            - storm
            - thunder
            - frost

moodlight:
  name: Moodlight
  description: "Turn the moodlight on with a colour or off."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to control.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    enabled:
      name: Enabled
      description: "Set to false to turn the moodlight off; the other fields are then ignored."
      default: true
      selector:
        boolean: {}
    color:
      name: Color
      description: "Moodlight colour."
      selector:
        color_rgb: {}
    brightness:
      name: Brightness
      description: "Moodlight brightness (0-255)."
      example: 120
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    kelvin:
      name: Color temperature
      description: "Colour temperature in Kelvin. Awtrix 3 only; ignored by AWTRIX NG."
      example: 3000
      selector:
        number:
          min: 2000
          max: 6500
          mode: box
          unit_of_measurement: K

indicator:
  name: Indicator
  description: "Control one of the three indicator pixels on the right edge of the display."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to control.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    indicator:
      name: Indicator
      required: true
      description: "Which indicator: 1 top, 2 middle, 3 bottom."
      example: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    enabled:
      name: Enabled
      description: "Set to false to turn the indicator off; the other fields are then ignored."
      default: true
      selector:
        boolean: {}
    color:
      name: Color
      description: "Indicator colour."
      selector:
        color_rgb: {}
    blink:
      name: Blink period
      description: "Blink period in milliseconds, 0 = solid."
      example: 500
      selector:
        number:
          min: 0
          max: 65535
          mode: box
          unit_of_measurement: ms
    fade:
      name: Fade period
      description: "Fade period in milliseconds, 0 = no fade."
      example: 500
      selector:
        number:
          min: 0
          max: 65535
          mode: box
          unit_of_measurement: ms

play_sound:
  name: Play Sound
  description: "Play a sound. Give exactly one of the fields below."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to control.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
    sound:
      name: Sound
      description: "Name of a stored sound or melody (on AWTRIX NG also a plain DFPlayer track number)."
      example: "beep"
      selector:
        text: {}
    rtttl:
      name: RTTTL melody
      description: "Inline RTTTL melody played on the buzzer."
      example: "two:d=4,o=5,b=200:c,e"
      selector:
        text: {}
    mp3:
      name: MP3
      description: "Stored MP3 to play. AWTRIX NG only."
      selector:
        text: {}
    melody:
      name: Melody
      description: "Stored melody to play. AWTRIX NG only."
      selector:
        text: {}
    track:
      name: DFPlayer track
      description: "Track number on the DFPlayer SD card (1-2999). AWTRIX NG only."
      selector:
        number:
          min: 1
          max: 2999
          mode: box
    station:
      name: Radio station
      description: "Stored radio station to start. AWTRIX NG only."
      selector:
        text: {}
    index:
      name: Radio station index
      description: "Position in the radio station list (0-31). AWTRIX NG only."
      selector:
        number:
          min: 0
          max: 31
          mode: box
    url:
      name: Stream URL
      description: "http(s) radio stream that is not stored. AWTRIX NG only."
      selector:
        text: {}

stop_sound:
  name: Stop Sound
  description: "Stop playing sounds and/or the radio stream. AWTRIX NG only."
  fields:
    device:
      name: Awtrix device
      required: true
      description: The Awtrix device to control.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
